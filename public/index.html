    <!-- Security headers via meta tags (excluding X-Frame-Options which requires HTTP header) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

    <!-- Enhanced Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; media-src 'self'; frame-src 'none'; form-action 'self'; base-uri 'self';">
    
    <!-- Anti-clickjacking protection -->
    <style id="antiClickjack">
      html { display: none !important; }
    </style>
    <script>
(function() {
  'use strict';
  
  try {
    if (self === top) {
      // Safe to show content - we're not in a frame
      var antiClickjack = document.getElementById("antiClickjack");
      if (antiClickjack && antiClickjack.parentNode) {
        antiClickjack.parentNode.removeChild(antiClickjack);
      }
    } else {
      // We're in a frame - safely redirect without using location.href directly
      var currentUrl = self.location.protocol + '//' + self.location.host + self.location.pathname;
      if (self.location.search) currentUrl += self.location.search;
      if (self.location.hash) currentUrl += self.location.hash;
      
      try {
        // Check if we can access parent location (same origin)
        var parentHost = top.location.hostname;
        var currentHost = self.location.hostname;
        
        if (parentHost !== currentHost) {
          // Different origin - safe to redirect using constructed URL
          top.location.replace(currentUrl);
        }
      } catch(e) {
        // Cross-origin restriction - redirect to break out of frame
        try {
          top.location.replace(currentUrl);
        } catch(e2) {
          // If all else fails, navigate current window with constructed URL
          self.location.replace(currentUrl);
        }
      }
    }
  } catch(globalError) {
    // Fallback: ensure content is visible even if script fails
    var antiClickjack = document.getElementById("antiClickjack");
    if (antiClickjack && antiClickjack.parentNode) {
      antiClickjack.parentNode.removeChild(antiClickjack);
    }
  }
})();
</script>

    <!-- Enhanced security script for font loading timeout and validation -->
    <script>
(function() {
  'use strict';
  
  var MAX_FONT_LOAD_TIME = 5000;
  var MAX_FONT_RETRY_ATTEMPTS = 2;
  var fontLoadAttempts = 0;
  
  // Secure URL validation function
  function isValidUrl(url) {
    try {
      var parsedUrl = new URL(url);
      // Only allow https and same origin
      return parsedUrl.protocol === 'https:' && 
             (parsedUrl.hostname === 'fonts.googleapis.com' || 
              parsedUrl.hostname === 'fonts.gstatic.com' ||
              parsedUrl.origin === window.location.origin);
    } catch (e) {
      return false;
    }
  }
  
  // Secure setAttribute wrapper
  function secureSetAttribute(element, name, value) {
    if (name === 'href' && typeof value === 'string') {
      if (isValidUrl(value)) {
        element.setAttribute(name, value);
      } else {
        console.warn('Blocked potentially unsafe URL:', value);
      }
    } else if (name === 'src' && typeof value === 'string') {
      if (isValidUrl(value)) {
        element.setAttribute(name, value);
      } else {
        console.warn('Blocked potentially unsafe src:', value);
      }
    } else {
      // For other attributes, use standard validation
      if (typeof value === 'string' && value.length < 2000) {
        element.setAttribute(name, value);
      }
    }
  }
  
  function removeFontLoadingClass() {
    if (document.body) {
      document.body.classList.remove('font-loading');
    }
  }
  
  function applyFallbackFonts() {
    var fallbackStyle = document.createElement('style');
    fallbackStyle.textContent = `
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif !important; 
      }
      .cinzel-fallback { 
        font-family: "Times New Roman", serif !important; 
      }
      .dancing-script-fallback { 
        font-family: "Brush Script MT", cursive !important; 
      }
    `;
    
    // Validate style content before adding
    if (fallbackStyle.textContent.length < 500 && !/javascript:|data:|expression/i.test(fallbackStyle.textContent)) {
      document.head.appendChild(fallbackStyle);
    }
  }
  
  var fontLoadTimeout = setTimeout(function() {
    console.warn('Font loading timeout - using system fonts');
    removeFontLoadingClass();
    applyFallbackFonts();
  }, MAX_FONT_LOAD_TIME);
  
  // Modern font loading API with error handling
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() {
      clearTimeout(fontLoadTimeout);
      removeFontLoadingClass();
    }).catch(function(error) {
      console.warn('Font loading failed:', error.message);
      clearTimeout(fontLoadTimeout);
      removeFontLoadingClass();
      applyFallbackFonts();
    });
  } else {
    // Fallback for older browsers
    setTimeout(function() {
      clearTimeout(fontLoadTimeout);
      removeFontLoadingClass();
    }, 2000);
  }
  
  // Monitor font loading errors with rate limiting
  document.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'LINK' && e.target.rel === 'stylesheet') {
      fontLoadAttempts++;
      if (fontLoadAttempts > MAX_FONT_RETRY_ATTEMPTS) {
        console.warn('Multiple font load failures detected - blocking further attempts');
        // Remove any remaining font link elements
        var fontLinks = document.querySelectorAll('link[href*="fonts.googleapis.com"]');
        fontLinks.forEach(function(link) {
          if (link.parentNode) {
            link.parentNode.removeChild(link);
          }
        });
        applyFallbackFonts();
      }
    }
  }, true);
  
  // Enhanced security: Override createElement with secure setAttribute
  var originalCreateElement = document.createElement;
  document.createElement = function(tagName) {
    var element = originalCreateElement.call(document, tagName);
    
    // Override setAttribute for dynamic elements
    if (tagName.toLowerCase() === 'link' || tagName.toLowerCase() === 'script') {
      var originalSetAttribute = element.setAttribute;
      element.setAttribute = function(name, value) {
        secureSetAttribute(this, name, value);
      };
      
      // Override href property specifically
      Object.defineProperty(element, 'href', {
        set: function(value) {
          secureSetAttribute(this, 'href', value);
        },
        get: function() {
          return this.getAttribute('href');
        },
        configurable: true
      });
      
      // Override src property specifically  
      Object.defineProperty(element, 'src', {
        set: function(value) {
          secureSetAttribute(this, 'src', value);
        },
        get: function() {
          return this.getAttribute('src');
        },
        configurable: true
      });
    }
    
    return element;
  };
})();
</script>
