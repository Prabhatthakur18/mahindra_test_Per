<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Mahindra Personalisation App - Customize your comfort kit with bespoke embroidery"
    />

    <!-- Anti-Clickjack: keep page hidden if framed -->
    <style id="antiClickjack">html { display: none !important; }</style>
    <script nonce="{{RANDOM_NONCE}}">
      (function () {
        'use strict';
        try {
          if (self === top) {
            var antiClickjack = document.getElementById('antiClickjack');
            if (antiClickjack && antiClickjack.parentNode) {
              antiClickjack.parentNode.removeChild(antiClickjack);
            }
          }
        } catch (e) {
          var fallback = document.getElementById('antiClickjack');
          if (fallback && fallback.parentNode) {
            fallback.parentNode.removeChild(fallback);
          }
        }
      })();
    </script>

    <!-- Fonts (validated server-side) -->
    <link
      href="%REACT_APP_FONTS_CINZEL%"
      rel="stylesheet"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="%REACT_APP_FONTS_MAIN%"
      rel="stylesheet"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="%REACT_APP_FONTS_EXTENDED%"
      rel="stylesheet"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Fallback fonts for noscript -->
    <noscript>
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
        }
      </style>
    </noscript>

    <title>Mahindra Personalisation App</title>
  </head>
  <body class="font-loading">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
